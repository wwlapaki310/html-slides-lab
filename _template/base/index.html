<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <title>スライドタイトル</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- reveal.js 本体・テーマ（CDN） -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/reveal.js@5.1.0/dist/reveal.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/reveal.js@5.1.0/dist/theme/white.css" id="theme" />
  <!-- コードハイライト用（使わない場合は削除可） -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/reveal.js@5.1.0/plugin/highlight/monokai.css" />

  <!-- このリポジトリ共通の基礎デザイン -->
  <link rel="stylesheet" href="../../_template/base/css/theme.css" />

  <script>
    // ?pdf で開いた場合に reveal.js の print-pdf 判定用へURLを書き換える。
    // reveal.js は window.location.search に "print-pdf" という文字列が
    // 含まれるかどうかで印刷用スタイルを切り替える実装のため、
    // 覚えやすい "?pdf" を透過的に "print-pdf" へ変換している。
    (function () {
      var params = new URLSearchParams(window.location.search);
      if (params.has('pdf') && !/print-pdf/i.test(window.location.search)) {
        params.delete('pdf');
        params.set('print-pdf', '');
        var qs = params.toString();
        var newUrl = window.location.pathname + (qs ? '?' + qs : '') + window.location.hash;
        window.history.replaceState(null, '', newUrl);
      }
    })();
  </script>
</head>
<body>
  <div class="reveal">
    <div class="slides">

      <!-- 表紙: デザインにこだわりたいスライドは生HTMLで直接書く -->
      <section>
        <h1>スライドタイトル</h1>
        <p>サブタイトル・発表者名・日付など</p>
      </section>

      <!-- 本編: 同じフォルダの draft.md（原稿）を自動で読み込んでスライド化する -->
      <section data-markdown="draft.md"
                data-separator="^\n---\n$"
                data-separator-vertical="^\n----\n$"
                data-separator-notes="^Note:"
                data-charset="utf-8">
      </section>

      <!-- 画像を大きく見せたい等、レイアウトを凝りたいスライドは生HTMLで追加してもよい -->
      <section>
        <h2>画像の例（レイアウトを凝る場合）</h2>
        <img src="assets/sample-image.png" alt="説明テキスト" style="max-height: 500px;" />
      </section>

      <!-- 動画を貼るスライドの例 -->
      <section>
        <h2>動画の例</h2>
        <video data-autoplay controls style="max-height: 500px;">
          <source src="assets/sample-video.mp4" type="video/mp4" />
        </video>
      </section>

    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/reveal.js@5.1.0/dist/reveal.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/reveal.js@5.1.0/plugin/markdown/markdown.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/reveal.js@5.1.0/plugin/notes/notes.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/reveal.js@5.1.0/plugin/highlight/highlight.js"></script>
  <script>
    Reveal.initialize({
      hash: true,          // URLにスライド番号が付き、直接リンク可能
      controls: true,      // 画面下部の矢印
      progress: true,      // 進捗バー
      center: true,
      transition: 'slide', // none/fade/slide/convex/concave/zoom
      // PDF化: URL末尾に "?pdf" を付けてChromeで印刷→PDF保存
      plugins: [ RevealMarkdown, RevealNotes, RevealHighlight ]
    });
  </script>
</body>
</html>
