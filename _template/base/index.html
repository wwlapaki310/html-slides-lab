<!doctype html>
<html lang="ja" data-theme="blue">
<head>
  <meta charset="utf-8" />
  <title>スライドタイトル</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- reveal.js 本体・テーマ（CDN） -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/reveal.js@5.1.0/dist/reveal.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/reveal.js@5.1.0/dist/theme/white.css" id="theme" />
  <!-- コードハイライト用（使わない場合は削除可） -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/reveal.js@5.1.0/plugin/highlight/monokai.css" />

  <!-- このリポジトリ共通の基礎デザイン（配色・タイトルバナー・コーナースロット） -->
  <link rel="stylesheet" href="../../_template/base/css/theme.css?v=7" />

  <script>
    // ?pdf で開いた場合に reveal.js の print-pdf 判定用へURLを書き換える。
    (function () {
      var params = new URLSearchParams(window.location.search);
      if (params.has('pdf') && !/print-pdf/i.test(window.location.search)) {
        params.delete('pdf');
        params.set('print-pdf', '');
        var qs = params.toString();
        var newUrl = window.location.pathname + (qs ? '?' + qs : '') + window.location.hash;
        window.history.replaceState(null, '', newUrl);
      }
    })();
  </script>

  <script>
    // file:// で直接開くと、ブラウザのセキュリティ制限で draft.md を fetch できず、
    // 本編スライドが丸ごと空になって「表紙1枚しか出ない／ページ送りできない」状態になる。
    // 原因がすぐ分かるよう画面に警告を出す。
    // ローカル確認は必ずHTTP経由で: python -m http.server 8000 （リポジトリルートで実行）
    if (window.location.protocol === 'file:') {
      window.addEventListener('DOMContentLoaded', function () {
        var el = document.createElement('div');
        el.style.cssText = 'position:fixed;z-index:9999;top:0;left:0;right:0;padding:14px 18px;'
          + 'background:#dc2626;color:#fff;font:14px/1.6 sans-serif;text-align:left;';
        el.innerHTML = '<strong>file:// で開いています。</strong> '
          + 'この方法では draft.md を読み込めないため、表紙しか表示されずページ送りもできません。<br>'
          + 'リポジトリのルートで <code>python -m http.server 8000</code> を実行し、'
          + 'http://localhost:8000/ 経由で開いてください（公開URLならそのままで動きます）。';
        document.body.appendChild(el);
      });
    }
  </script>
</head>
<body>
  <div class="reveal">
    <div class="slides">

      <!-- 表紙: デザインにこだわりたいスライドは生HTMLで直接書く -->
      <section>
        <h1>スライドタイトル</h1>
        <p>サブタイトル・発表者名・日付など</p>
      </section>

      <!-- 本編: 同じフォルダの draft.md（原稿）を自動で読み込んでスライド化する -->
      <section data-markdown="draft.md"
                data-separator="^\n---\n$"
                data-separator-vertical="^\n----\n$"
                data-separator-notes="^Note:"
                data-charset="utf-8">
      </section>

      <!-- 画像を大きく見せたい等、レイアウトを凝りたいスライドは生HTMLで追加してもよい -->
      <section>
        <h2>画像の例（レイアウトを凝る場合）</h2>
        <img src="assets/sample-image.svg" alt="説明テキスト" style="max-height: 480px;" />
      </section>

      <!-- 動画を貼るスライドの例（assets/ に動画を置いたらコメントを外す） -->
      <!--
      <section>
        <h2>動画の例</h2>
        <video data-autoplay controls style="max-height: 480px;">
          <source src="assets/sample-video.mp4" type="video/mp4" />
        </video>
      </section>
      -->

    </div>
  </div>

  <!-- 固定コーナースロット: 全スライド共通で画面に固定表示される（不要なら削除してよい） -->
  <div class="hsl-topright">
    <!-- 例: ロゴを置く場合 -->
    <!-- <img src="../../_template/base/assets/logo.png" alt="logo" /> -->
  </div>
  <div class="hsl-bottomright">
    <!-- 例: スポンサーロゴやQRコードなど -->
  </div>
  <div class="hsl-footer">発表者名 / イベント名 / YYYY-MM-DD</div>

  <script src="https://cdn.jsdelivr.net/npm/reveal.js@5.1.0/dist/reveal.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/reveal.js@5.1.0/plugin/markdown/markdown.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/reveal.js@5.1.0/plugin/notes/notes.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/reveal.js@5.1.0/plugin/highlight/highlight.js"></script>
  <script>
    Reveal.initialize({
      hash: true,
      controls: true,
      progress: true,
      center: true,
      transition: 'slide',
      // 16:9 + margin:0 でスライドを画面いっぱいに広げる。
      // 既定の 960x700 / margin:0.04 だと16:9の画面・PDFで左右に白帯が出るうえ、
      // タイトルバナーがスライド幅までしか伸びず全幅にならない。
      // 本文の余白は theme.css 側の padding で持たせている。
      width: 1280,
      height: 720,
      margin: 0,
      // PDF化: URL末尾に "?pdf" を付けてChromeで印刷→PDF保存
      plugins: [ RevealMarkdown, RevealNotes, RevealHighlight ]
    });
  </script>
</body>
</html>
